name: Wake On LAN

on:
  repository_dispatch:
    types: [wol_trigger]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
    - name: Send Magic Packet
      run: |
        sudo apt-get update
        sudo apt-get install -y wakeonlan
        wakeonlan -i 188.225.125.155 -p 9 30:56:0f:0a:d9:9d
